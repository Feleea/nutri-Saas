name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: suasnutri_owner
          POSTGRES_PASSWORD: owner_dev_pw
          POSTGRES_DB: suasnutri
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U suasnutri_owner" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_OWNER: postgresql://suasnutri_owner:owner_dev_pw@localhost:5432/suasnutri
      DATABASE_URL: postgresql://suasnutri_app:app_dev_pw@localhost:5432/suasnutri
      DATABASE_URL_ADMIN: postgresql://suasnutri_admin:admin_dev_pw@localhost:5432/suasnutri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Criar papéis do banco
        run: psql "$DATABASE_URL_OWNER" -f docker/init-roles.sql
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:rls
      - run: npm run typecheck
      - name: Testes unitários
        run: npm run test:unit
      - name: Testes de isolamento e permissões (bloqueiam o PR)
        run: npm run test:security
