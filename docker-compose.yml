services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: suasnutri_owner
      POSTGRES_PASSWORD: owner_dev_pw
      POSTGRES_DB: suasnutri
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
volumes:
  pgdata:
